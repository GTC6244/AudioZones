# Static virtual sinks for the headless spike — loaded by the PipeWire daemon at
# startup via pipewire.conf.d. Uses support.null-audio-sink, which is its OWN driver
# (no real hardware, no ALSA, no logind needed). node.always-process keeps the DSP
# ports alive even when idle, so they don't vanish under WirePlumber's suspend policy.
#
# Each sink gets FL/FR playback INPUT ports plus a .monitor with FL/FR OUTPUT ports.
# That lets us link ZoneA.monitor (out) -> ZoneB.playback (in) — a link WirePlumber
# did NOT create, which is the Q3 coexistence test.
context.objects = [
    {   factory = adapter
        args = {
            factory.name            = support.null-audio-sink
            node.name               = "ZoneA"
            node.description        = "ZoneA"
            media.class             = Audio/Sink
            object.linger           = true
            node.always-process     = true
            audio.position          = [ FL FR ]
            monitor.channel-volumes = true
        }
    }
    {   factory = adapter
        args = {
            factory.name            = support.null-audio-sink
            node.name               = "ZoneB"
            node.description        = "ZoneB"
            media.class             = Audio/Sink
            object.linger           = true
            node.always-process     = true
            audio.position          = [ FL FR ]
            monitor.channel-volumes = true
        }
    }
]
